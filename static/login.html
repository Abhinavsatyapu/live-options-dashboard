<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in · Live Options Plan</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel2: #1a2230;
    --border: #243044;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --blue: #5b9cff;
    --red: #ff6b7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
  label { display: block; color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 14px 14px;
    font-size: 16px; /* iOS avoids zoom */
    margin-bottom: 14px; outline: none;
  }
  input:focus { border-color: var(--blue); }
  button {
    width: 100%; margin-top: 6px; min-height: 48px;
    background: var(--blue); color: #061018; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button:active { opacity: 0.9; }
  button:disabled { opacity: 0.55; cursor: wait; }
  .err {
    background: #3d1e24; color: var(--red); border: 1px solid #5a2a2a;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
    font-size: 0.9rem; display: none;
  }
  .err.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="form" method="post" action="/login" autocomplete="on">
    <h1>Live Options Plan</h1>
    <div class="sub">Sign in to view the dashboard</div>
    <div class="err" id="err"></div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">Sign in</button>
  </form>
</div>
<script>
const form = document.getElementById("form");
const err = document.getElementById("err");
const btn = document.getElementById("btn");
const params = new URLSearchParams(location.search);
if (params.get("e") === "1") {
  err.textContent = "Invalid username or password.";
  err.classList.add("show");
} else if (params.get("e") === "rate") {
  err.textContent = "Too many attempts. Wait a moment and try again.";
  err.classList.add("show");
} else if (params.get("e") === "cfg") {
  err.textContent = "Sign-in is not configured on the server.";
  err.classList.add("show");
}
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.classList.remove("show");
  btn.disabled = true;
  try {
    const body = new URLSearchParams(new FormData(form));
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
      body,
      credentials: "same-origin",
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      location.href = data.next || "/";
      return;
    }
    err.textContent = data.error || "Invalid username or password.";
    err.classList.add("show");
  } catch (e) {
    err.textContent = "Network error. Try again.";
    err.classList.add("show");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
