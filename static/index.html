<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>Options Terminal</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel2: #1a2230;
    --border: #243044;
    --border-soft: #1e2a3c;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --green: #3dd68c;
    --red: #ff6b7a;
    --amber: #f5c542;
    --blue: #5b9cff;
    --purple: #b388ff;
    --gold: #f0c35a;
    --skip: #6a7385;
    --live: #3dd68c;
    --stale: #f5c542;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .tnum, .kv .v, .kpi .v, table, .sym, .px, .money {
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 12px 16px 48px; }
  /* Header */
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px 16px;
    align-items: flex-start; justify-content: space-between;
    margin-bottom: 12px;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #3dd68c, #5b9cff);
    box-shadow: 0 0 0 1px rgba(91,156,255,0.3);
    flex-shrink: 0;
  }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 750; letter-spacing: -0.03em; }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    color: var(--muted); font-size: 12px; margin-top: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    background: var(--live); box-shadow: 0 0 0 2px rgba(61,214,140,0.2);
  }
  .dot.stale { background: var(--stale); box-shadow: 0 0 0 2px rgba(245,197,66,0.2); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  }
  .pill.warn { background: #3a1d1d; border-color: #5a2a2a; color: #ffb4b4; }
  .pill.ok { background: #1e3d2a; border-color: #2a5a3a; color: var(--green); }
  .pill.mkt-open { color: var(--green); border-color: #2a5a3a; }
  .pill.mkt-closed { color: var(--muted); }
  .userbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; color: var(--muted); font-size: 12px;
  }
  .userbar b { color: var(--text); }
  .spyline { font-size: 13px; color: var(--muted); text-align: right; }
  .spyline b { color: var(--text); font-weight: 700; }
  /* KPI strip */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-bottom: 12px;
  }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; min-height: 64px;
  }
  .kpi .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 650; }
  .kpi .v { font-size: 1.05rem; font-weight: 750; margin-top: 4px; letter-spacing: -0.01em; }
  .kpi .s { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .progress {
    height: 6px; background: #152032; border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border-soft); margin-top: 8px;
  }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); }
  .progress.warn > i { background: linear-gradient(90deg, var(--amber), var(--green)); }
  /* Banner / notes */
  .banner {
    background: linear-gradient(90deg, #3a1d1d, #2a1520 45%, #1a2230);
    border: 1px solid #5a2a2a; color: #ffb4b4;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; font-weight: 600;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .banner .pill { background: #5a2020; color: #ffd0d0; border-color: #6a3030; }
  .quote-warn {
    display: none; background: #3a3010; border: 1px solid #5a4a20; color: #ffcc80;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; font-weight: 600; font-size: 13px;
  }
  .quote-warn.show { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btnote {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; margin-bottom: 10px; color: var(--muted); font-size: 11px;
    max-height: 3.2em; overflow: hidden;
  }
  .btnote.expanded { max-height: none; }
  .btnote-toggle {
    background: none; border: none; color: var(--blue); font-size: 11px; font-weight: 650;
    cursor: pointer; padding: 0; margin: 0 0 10px; min-height: 28px;
  }
  /* Sticky tabs */
  .tabs-wrap {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,15,20,0.92); backdrop-filter: blur(10px);
    padding: 8px 0 10px; margin: 0 -4px 10px; border-bottom: 1px solid var(--border-soft);
  }
  .tabs {
    display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 0 4px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 650;
    min-height: 44px; white-space: nowrap; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tab.active { background: var(--panel2); color: var(--text); border-color: var(--blue); }
  .tab .count {
    background: #243044; color: var(--muted); border-radius: 999px;
    font-size: 11px; font-weight: 750; padding: 2px 7px; min-width: 22px; text-align: center;
  }
  .tab.active .count { background: #1e3a5f; color: #cfe2ff; }
  .panel { display: none; }
  .panel.active { display: block; }
  /* Cards */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
    transition: border-color .15s ease;
  }
  .card.skip { opacity: 0.55; }
  .card.rec { border-color: #2a5a3a; box-shadow: inset 0 0 0 1px #1e3a28; }
  .card.sure { border-color: #5a4a20; box-shadow: inset 0 0 0 1px #3a3010; }
  .row-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-start; justify-content: space-between; }
  .sym { font-size: 1.2rem; font-weight: 780; letter-spacing: -0.02em; }
  .tag { color: var(--amber); font-size: 12px; font-weight: 650; margin-left: 6px; }
  .trade-line { color: var(--text); font-size: 13px; font-weight: 600; margin-top: 4px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .kv { background: var(--panel2); border-radius: 8px; padding: 8px 10px; border: 1px solid transparent; }
  .kv.primary { border-color: #2a3a50; }
  .kv .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 650; }
  .kv .v { font-weight: 700; margin-top: 3px; word-break: break-word; font-size: 13px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .flash-up { animation: flashUp .55s ease; }
  .flash-dn { animation: flashDn .55s ease; }
  @keyframes flashUp { from { background: rgba(61,214,140,0.28); } to { background: transparent; } }
  @keyframes flashDn { from { background: rgba(255,107,122,0.28); } to { background: transparent; } }
  .status {
    display: inline-block; padding: 4px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 750; letter-spacing: 0.03em;
  }
  .st-WAITING { background: #2a3140; color: #c0c8d8; }
  .st-TRIGGERED { background: #1e3d2a; color: var(--green); }
  .st-STOPPED, .st-EARNINGS { background: #3d1e24; color: var(--red); }
  .st-IN { background: #2a2540; color: var(--purple); }
  .st-SKIP { background: #2a2e36; color: var(--skip); }
  .st-REC { background: #1e3d2a; color: var(--green); }
  .st-SEC { background: #2a3140; color: #c0c8d8; }
  .st-SURE { background: #3a3010; color: var(--gold); }
  .st-above\ high { background: #1e3d2a; color: var(--green); }
  .st-between { background: #2a3140; color: #c0c8d8; }
  .st-below\ low { background: #3d1e24; color: var(--red); }
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.04em; margin: 4px 4px 0 0;
  }
  .b-STOP_HIT, .b-ADVERSE_50 { background: #5a2020; color: #ffd0d0; }
  .b-TARGET_HIT { background: #1e3d2a; color: var(--green); }
  .b-EXIT_FRIDAY, .b-EXIT_EXPIRY { background: #3a3010; color: var(--amber); }
  .b-COVER_HIT { background: #2a2540; color: var(--purple); }
  .b-EARNINGS { background: #3a2a10; color: #ffcc80; }
  .details {
    margin-top: 8px; border-top: 1px solid var(--border-soft); padding-top: 8px;
  }
  .details > summary {
    cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 650;
    list-style: none; min-height: 36px; display: flex; align-items: center;
  }
  .details > summary::-webkit-details-marker { display: none; }
  .details > summary::before { content: "▸ "; color: var(--blue); }
  .details[open] > summary::before { content: "▾ "; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 650; font-size: 11px; text-transform: uppercase; }
  .empty {
    background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 28px 16px; text-align: center; color: var(--muted);
  }
  .empty b { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; }
  .skeleton .sk {
    height: 88px; border-radius: var(--radius); margin-bottom: 10px;
    background: linear-gradient(90deg, #121821 0%, #1a2230 50%, #121821 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .err { color: var(--amber); font-size: 12px; margin-top: 8px; }
  .footer {
    color: var(--muted); font-size: 10px; margin-top: 18px; padding-top: 10px;
    border-top: 1px solid var(--border); line-height: 1.35;
  }
  .occ { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
  .btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 14px; min-height: 44px; font-weight: 650; cursor: pointer; font-size: 14px;
  }
  .btn:focus-visible, .userbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .userbar button, .btn { min-height: 44px; }
  .btn-primary { background: #1e3a5f; border-color: var(--blue); }
  .btn-danger { background: #3d1e24; border-color: #5a2a2a; color: #ffb4b4; }
  .btn-sm { min-height: 40px; padding: 8px 12px; font-size: 12px; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 12px;
  }
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; font-weight: 650; }
  input, select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px 10px; font-size: 16px; min-height: 44px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(91,156,255,0.18); }
  textarea { min-height: 72px; font-size: 14px; }
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .admin-only { display: none; }
  body.is-admin .admin-only { display: block; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  @media (max-width: 700px) {
    .wrap { padding: 10px 10px 56px; }
    th:nth-child(n+5), td:nth-child(n+5) { display: none; }
    .grid .kv.secondary { display: none; }
    .details .grid .kv.secondary { display: block; }
  }
  @media (min-width: 701px) {
    .details { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="brand-row">
        <div class="mark" aria-hidden="true"></div>
        <h1>Options Terminal</h1>
        <span class="pill warn" id="backdrop-pill">—</span>
        <span class="pill mkt-closed" id="mkt-pill">US hours</span>
      </div>
      <div class="meta-row">
        <span class="dot" id="live-dot" title="Live"></span>
        <span id="meta">Connecting…</span>
        <span id="signals-asof"></span>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div class="userbar" id="userbar">
        <span>Signed in as <b id="who">…</b></span>
        <button type="button" id="signout">Sign out</button>
      </div>
      <div class="spyline" id="spy"></div>
    </div>
  </header>

  <div class="kpi-strip" id="kpi-strip" aria-label="Summary">
    <div class="kpi"><div class="k">Open positions</div><div class="v tnum" id="kpi-open">—</div></div>
    <div class="kpi"><div class="k">Risk vs $100k</div><div class="v tnum" id="kpi-risk">—</div><div class="s" id="kpi-risk-s"></div></div>
    <div class="kpi"><div class="k">WTD P&amp;L vs $3–4k</div><div class="v tnum" id="kpi-wtd">—</div><div class="progress" id="kpi-prog"><i style="width:0%"></i></div></div>
    <div class="kpi"><div class="k">Sure shots</div><div class="v tnum" id="kpi-sure">—</div><div class="s" id="kpi-signals"></div></div>
    <div class="kpi"><div class="k">Alerts</div><div class="v tnum" id="kpi-alerts">—</div></div>
  </div>

  <div class="banner" id="banner">SPY negative gamma — size down</div>
  <div class="quote-warn" id="quote-warn" role="status">Quotes delayed or rate-limited — showing last known / blank values.</div>
  <div class="btnote" id="btnote"></div>
  <button type="button" class="btnote-toggle" id="btnote-toggle" hidden>Show standing rule</button>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="early" aria-selected="true">Early ★ <span class="count" id="c-early">0</span></button>
      <button class="tab" role="tab" data-tab="weekly" aria-selected="false">Weekly ★ <span class="count" id="c-weekly">0</span></button>
      <button class="tab" role="tab" data-tab="squeeze" aria-selected="false">Squeeze <span class="count" id="c-squeeze">0</span></button>
      <button class="tab" role="tab" data-tab="reversal" aria-selected="false">Reversal <span class="count" id="c-reversal">0</span></button>
      <button class="tab" role="tab" data-tab="watch" aria-selected="false">Watch <span class="count" id="c-watch">0</span></button>
      <button class="tab" role="tab" data-tab="positions" aria-selected="false">Positions <span class="count" id="c-positions">0</span></button>
    </div>
  </div>

  <section class="panel active" id="panel-early" role="tabpanel"><div class="skeleton" id="sk-early"><div class="sk"></div><div class="sk"></div></div></section>
  <section class="panel" id="panel-weekly" role="tabpanel"></section>
  <section class="panel" id="panel-squeeze" role="tabpanel"></section>
  <section class="panel" id="panel-reversal" role="tabpanel"></section>
  <section class="panel" id="panel-watch" role="tabpanel"></section>
  <section class="panel" id="panel-positions" role="tabpanel">
    <div class="summary-bar" id="pos-summary"></div>
    <div class="admin-only card" id="pos-form-wrap">
      <div class="row-top"><div><b>Add / edit position</b> <span class="note" id="form-hint">Rulebook defaults autofill stop/target</span></div></div>
      <form id="pos-form" class="form-grid" style="margin-top:10px" onsubmit="return false;">
        <input type="hidden" id="f-id" value="" />
        <div><label>Ticker</label><input id="f-ticker" autocomplete="off" placeholder="NVDA" /></div>
        <div><label>Signal type</label>
          <select id="f-signal">
            <option value="WEEKLY">WEEKLY (bullish)</option>
            <option value="SQ">SQ</option>
            <option value="SQ+VC3">SQ+VC3</option>
            <option value="REVERSAL">REVERSAL (bearish)</option>
            <option value="ABSORBED">ABSORBED</option>
          </select>
        </div>
        <div><label>Side</label>
          <select id="f-side"><option value="call">call</option><option value="put">put</option></select>
        </div>
        <div><label>Structure</label>
          <select id="f-structure"><option value="atm">ATM single</option><option value="spread">Debit spread</option><option value="1em">1EM spread</option></select>
        </div>
        <div><label>Long OCC</label><input id="f-long" class="occ" placeholder="NVDA261106C00190000" /></div>
        <div><label>Short OCC (optional)</label><input id="f-short" class="occ" placeholder="leave blank for single" /></div>
        <div><label>Qty (contracts)</label><input id="f-qty" type="number" inputmode="numeric" min="1" value="1" /></div>
        <div><label>Fill debit / contract</label><input id="f-fill" type="number" inputmode="decimal" step="0.01" placeholder="2.45" /></div>
        <div><label>Entry date</label><input id="f-entry" type="date" /></div>
        <div><label>Expiry</label><input id="f-expiry" type="date" /></div>
        <div><label>Stop (underlying)</label><input id="f-stop" type="number" inputmode="decimal" step="0.01" placeholder="signal-week low / D+1 high" /></div>
        <div><label>Profit target %</label><input id="f-pt" type="number" inputmode="decimal" step="1" value="100" /></div>
        <div><label>Time exit</label>
          <select id="f-time"><option value="friday">Friday close</option><option value="expiry">2d before expiry</option></select>
        </div>
        <div><label>Cover level (reversals)</label><input id="f-cover" type="number" inputmode="decimal" step="0.01" /></div>
        <div style="grid-column:1/-1"><label>Notes</label><textarea id="f-notes" placeholder="optional"></textarea></div>
      </form>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-save">Save position</button>
        <button type="button" class="btn" id="btn-reset">Clear form</button>
      </div>
      <div class="err" id="pos-form-err"></div>
    </div>
    <div id="pos-list"></div>
  </section>

  <div class="err" id="errors"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const TAB_KEY = "opts_terminal_tab";
async function fetchWithTimeout(url, opts = {}, ms = 45000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(t);
  }
}
const fmt = (n, d=2) => (n == null || Number.isNaN(n)) ? "—" : Number(n).toFixed(d);
const fmtPct = (n, d=2) => (n == null) ? "—" : ((n >= 0 ? "+" : "") + Number(n).toFixed(d) + "%");
const clsChg = (n) => (n == null) ? "" : (n >= 0 ? "pos" : "neg");
const arrow = (n) => (n == null) ? "" : (n > 0 ? " ▲" : (n < 0 ? " ▼" : ""));
const money = (n, d=2) => {
  if (n == null || Number.isNaN(n)) return "—";
  const sign = n >= 0 ? "+" : "-";
  const abs = Math.abs(Number(n));
  return sign + "$" + abs.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const moneyAbs = (n, d=0) => {
  if (n == null || Number.isNaN(n)) return "—";
  return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
};

let ME = { user: null, role: "guest", canEdit: false };
let LAST_SNAP_TS = 0;
let PREV_PX = {};
let POS_SUMMARY = null;
let LAST_DATA = null;

function setTab(tab) {
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  const panel = $("panel-" + tab);
  if (panel) panel.classList.add("active");
  try { localStorage.setItem(TAB_KEY, tab); } catch (e) {}
  if (tab === "positions") refreshPositions();
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => setTab(btn.dataset.tab));
});
try {

function kv(k, v, extra="", cls="") {
  return `<div class="kv ${cls}"><div class="k">${k}</div><div class="v ${extra}">${v}</div></div>`;
}
function badges(kinds, earningsBadge) {
  let html = "";
  (kinds || []).forEach(k => {
    html += `<span class="badge b-${k}">${k.replace(/_/g, " ")}</span>`;
  });
  if (earningsBadge) html += `<span class="badge b-EARNINGS">${earningsBadge}</span>`;
  return html;
}
function atmBlock(side, atm) {
  if (!atm) return kv("ATM " + side, "—", "", "secondary");
  return kv("ATM " + side + " " + fmt(atm.strike, 2),
    `mid ${fmt(atm.mid, 2)} · ${fmt(atm.bid, 2)}/${fmt(atm.ask, 2)}`, "", "secondary");
}
function occLine(r) {
  if (r.is_atm) return r.long_occ || "";
  return `${r.long_occ || ""} / ${r.short_occ || ""}`;
}
function flashClass(sym, px) {
  if (px == null) return "";
  const prev = PREV_PX[sym];
  PREV_PX[sym] = px;
  if (prev == null || prev === px) return "";
  return px > prev ? "flash-up" : "flash-dn";
}
function emptyState(title, sub) {
  return `<div class="empty"><b>${title}</b>${sub || ""}</div>`;
}
function usMarketStatus(now = new Date()) {
  // Approximate US/Eastern hours Mon–Fri 09:30–16:00
  try {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(now);
    const map = Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
    const wd = map.weekday;
    const hh = Number(map.hour), mm = Number(map.minute);
    const mins = hh * 60 + mm;
    const weekday = !["Sat", "Sun"].includes(wd);
    const open = weekday && mins >= 9 * 60 + 30 && mins < 16 * 60;
    return { open, label: open ? "US market open" : "US market closed", wd, et: `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")} ET` };
  } catch (e) {
    return { open: false, label: "US hours", et: "" };
  }
}
function updateLiveDot() {
  const age = (Date.now() - LAST_SNAP_TS) / 1000;
  const stale = !LAST_SNAP_TS || age > 30;
  $("live-dot").classList.toggle("stale", stale);
  $("live-dot").title = stale ? "Stale (>30s)" : "Live";
}

function earlyCard(r) {
  const plan = r.plan || {};
  const side = r.side === "bearish" ? "BEAR" : "BULL";
  const sure = r.tier === "S" && !r.earningsFlag;
  const st = r.earningsFlag ? "EARNINGS" : (sure ? "SURE" : "WATCH");
  const stClass = r.earningsFlag ? "st-EARNINGS" : (sure ? "st-SURE" : "st-WAITING");
  const occ = plan.long_occ ? (plan.is_atm ? plan.long_occ : (plan.long_occ + " / " + (plan.short_occ || ""))) : "—";
  const flash = flashClass(r.sym, r.price);
  const primary = `
      ${kv("Price", `<span class="px ${flash}">${fmt(r.price)}</span> <span class="${clsChg(r.changePct)}">${fmtPct(r.changePct)}${arrow(r.changePct)}</span>`, "", "primary")}
      ${kv("Live mid", plan.spreadMid != null ? fmt(plan.spreadMid, 3) : "—", "", "primary")}
      ${kv("Structure", plan.structure || r.structure || "—", "", "primary")}
      ${kv("Size", plan.size != null ? String(plan.size) : (r.size || "—"), "", "primary")}`;
  const secondary = `
      ${kv("Entry", r.entry || "—", "", "secondary")}
      ${kv("Trigger", r.trigger != null ? fmt(r.trigger, 2) : "—", "", "secondary")}
      ${kv("Stop", r.stop != null ? (typeof r.stop === "number" ? fmt(r.stop, 2) : r.stop) : "—", "", "secondary")}
      ${kv("OCC", `<span class="occ">${occ}</span>`, "", "secondary")}
      ${kv("Debit", plan.debit != null ? fmt(plan.debit, 3) : "—", "", "secondary")}
      ${kv("Source", (r.source || "") + " · " + (r.week || r.session || ""), "", "secondary")}`;
  return `<div class="card ${sure ? "sure" : "rec"}">
    <div class="row-top">
      <div>
        <span class="sym">${r.sym}</span>
        <span class="tag">${side} · ${r.setup || ""} · conf ${((r.confidence || 0) * 100).toFixed(0)}%</span>
        <div class="trade-line">${plan.structure || r.structure || "Plan"} · mid ${plan.spreadMid != null ? fmt(plan.spreadMid, 3) : "—"}</div>
        <div class="note">${r.why || ""} · ${r.days_early || ""}${r.tierNote ? " · " + r.tierNote : ""}</div>
        ${badges(r.alertKinds, r.earningsBadge)}
      </div>
      <span class="status ${stClass}">${st}</span>
    </div>
    <div class="grid">${primary}${secondary}</div>
    <details class="details"><summary>Details</summary><div class="grid">${secondary}</div></details>
  </div>`;
}

function signalCard(r, mode) {
  const skip = r.skip;
  const rec = r.recommended && !skip;
  let status, stClass;
  if (mode === "reversal") {
    status = r.status || "WAITING";
    stClass = "st-" + status;
  } else {
    status = skip ? "SKIP" : (r.recommended ? "REC" : "SEC");
    stClass = skip ? "st-SKIP" : (rec ? "st-REC" : "st-SEC");
  }
  const struct = r.structure_label || (r.is_atm ? ("ATM " + r.side) : "debit spread");
  const maxP = r.maxProfit == null ? "uncapped" : fmt(r.maxProfit, 3);
  const strikes = r.is_atm ? fmt(r.long_strike, 2) + " ATM" : fmt(r.long_strike, 2) + " / " + fmt(r.short_strike, 2);
  const flash = flashClass(r.symbol, r.price);
  let triggerPrimary = "", triggerSecondary = "";
  if (mode === "reversal") {
    if (r.already_in) {
      triggerPrimary = kv("Cover if >", fmt(r.cover_above, 2) + (r.distTrigger != null ? ` (Δ ${fmt(r.distTrigger, 2)})` : ""), "", "primary");
      triggerSecondary = kv("Entry short", fmt(r.entry, 2), "", "secondary");
    } else {
      triggerPrimary = kv("Trigger <", fmt(r.trigger, 2) + (r.distTrigger != null ? ` (dist ${fmt(r.distTrigger, 2)})` : ""), "", "primary");
      triggerSecondary = kv("Stop >", fmt(r.sl, 2) + (r.distSL != null ? ` (room ${fmt(r.distSL, 2)})` : ""), "", "secondary");
    }
  }
  const primary = `
      ${kv("Price", `<span class="px ${flash}">${fmt(r.price)}</span> <span class="${clsChg(r.changePct)}">${fmtPct(r.changePct)}${arrow(r.changePct)}</span>`, "", "primary")}
      ${triggerPrimary}
      ${kv(r.is_atm ? "Option mid" : "Spread mid", fmt(r.spreadMid, 3), "", "primary")}
      ${kv("P&L ×" + r.size, money(r.pnlTotal) + arrow(r.pnlTotal), clsChg(r.pnlTotal), "primary")}`;
  const secondary = `
      ${triggerSecondary}
      ${kv("Expiry", r.expiry || "—", "", "secondary")}
      ${kv("Structure", struct, "", "secondary")}
      ${kv("Strikes", strikes, "", "secondary")}
      ${kv("Fri debit", fmt(r.debit, 3), "", "secondary")}
      ${kv("P&L / unit", money(r.pnlPerSpread != null ? r.pnlPerSpread * 100 : null) + arrow(r.pnlPerSpread), clsChg(r.pnlPerSpread), "secondary")}
      ${kv("Max profit", maxP, "", "secondary")}
      ${kv("Breakeven", fmt(r.breakeven, 2), "", "secondary")}
      ${kv("Long IV", r.long?.iv != null ? (r.long.iv * 100).toFixed(1) + "%" : "—", "", "secondary")}
      ${kv("Δ long", fmt(r.delta, 3), "", "secondary")}
      ${atmBlock(r.side === "put" ? "put" : "call", r.atm)}
      ${kv("Size", String(r.size) + (r.is_atm ? " ct" : " spr") + " · risk ~" + moneyAbs((r.debit || 0) * 100 * (r.size || 0), 0), "", "secondary")}`;
  return `<div class="card ${skip ? "skip" : ""} ${rec ? "rec" : ""}">
    <div class="row-top">
      <div>
        <span class="sym">${r.symbol}</span>
        <span class="tag">${r.tag || r.setup || ""}</span>
        <div class="trade-line">${struct} · <span class="occ">${occLine(r)}</span></div>
        <div class="note">${r.note || ""}</div>
        ${badges(r.alertKinds, r.earningsBadge)}
      </div>
      <span class="status ${stClass}">${status}</span>
    </div>
    <div class="grid">${primary}${secondary}</div>
    <details class="details"><summary>Details</summary><div class="grid">${secondary}</div></details>
  </div>`;
}

function watchTable(rows) {
  if (!rows.length) return emptyState("No watchlist rows", "Reversals watch updates with the Zone Monitor week.");
  const body = rows.map(w => `<tr>
    <td><b>${w.symbol}</b></td>

    <td><span class="status st-${w.status}">${w.status}</span></td>

  return `<div class="card"><div class="note" style="margin-bottom:8px">Arm only if Monday breaks low before high</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Sym</th><th>Price</th><th>Chg</th><th>Low</th><th>High</th><th>Status</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div></div>`;
}

function countAlerts(data, positions) {
  let n = 0;
  const seen = new Set();
  const add = (arr) => (arr || []).forEach(r => {
    (r.alertKinds || []).forEach(k => { const key = (r.symbol || r.sym || r.ticker) + ":" + k; if (!seen.has(key)) { seen.add(key); n++; } });
    if (r.earningsBadge) { const key = (r.symbol || r.sym || r.ticker) + ":E"; if (!seen.has(key)) { seen.add(key); n++; } }
  });
  if (data) {
    add(data.earlySureShots); add(data.weeklyBullish); add(data.weeklySqueeze); add(data.reversalBearish);
  }
  add(positions || []);
  return n;
}

function updateKpis() {
  const d = LAST_DATA;
  const s = POS_SUMMARY || {};
  $("kpi-open").textContent = s.openCount != null ? String(s.openCount) : "—";
  if (s.riskDeployed != null) {
    $("kpi-risk").textContent = moneyAbs(s.riskDeployed, 0);
    $("kpi-risk-s").textContent = fmt(s.riskPct, 1) + "% of $100k";
  }
  if (s.weekPnl != null) {
    $("kpi-wtd").textContent = money(s.weekPnl, 0);
    $("kpi-wtd").className = "v tnum " + clsChg(s.weekPnl);
    const pct = Math.min(100, s.targetProgressPct || 0);
    $("kpi-prog").className = "progress " + (pct < 50 ? "warn" : "");
    $("kpi-prog").innerHTML = `<i style="width:${pct}%"></i>`;
  }
  const sure = (d && d.earlySureShots) ? d.earlySureShots.length : 0;
  const active = d ? (d.weeklyBullish || []).filter(r => !r.skip).length + (d.reversalBearish || []).length : 0;
  $("kpi-sure").textContent = String(sure);
  $("kpi-signals").textContent = active + " active signal cards";
  $("kpi-alerts").textContent = String(countAlerts(d, Object.values(POS_MAP)));
}

async function refreshPositions() {
  try {
    const res = await fetchWithTimeout("/api/positions?status=open", { cache: "no-store", credentials: "same-origin" }, 45000);
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (!data.ok) {
      $("pos-list").innerHTML = `<div class="card"><div class="err">${data.error || "positions unavailable"}</div></div>`;
      $("c-positions").textContent = "0";
      return;
    }
    ME.canEdit = !!data.canEdit;
    if (ME.canEdit) document.body.classList.add("is-admin");
    else document.body.classList.remove("is-admin");
    renderSummary(data.summary);
    const rows = data.positions || [];
    $("c-positions").textContent = String(rows.length);
    $("pos-list").innerHTML = rows.length
      ? rows.map(positionCard).join("")
      : emptyState("No open positions", ME.canEdit ? "Use the form above to log a fill from your iPad." : "Admin can add positions.");
    updateKpis();
  } catch (e) {
    $("pos-list").innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
}

async function refresh() {
  try {
    if (($("meta").textContent || "").includes("Loading")) {
      $("meta").textContent = "Fetching live quotes…";
    }
    const res = await fetchWithTimeout("/api/snapshot", { cache: "no-store", credentials: "same-origin" }, 55000);
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (!data.ok) {
      $("meta").textContent = "Error: " + (data.error || res.status);
      $("live-dot").classList.add("stale");
      $("quote-warn").classList.add("show");
      $("quote-warn").textContent = "Snapshot error: " + (data.error || res.status);
      return;
    }
    LAST_DATA = data;
    LAST_SNAP_TS = Date.now();
    updateLiveDot();
    const mkt = usMarketStatus();
    const mktEl = $("mkt-pill");
    mktEl.textContent = mkt.label + (mkt.et ? " · " + mkt.et : "");
    mktEl.className = "pill " + (mkt.open ? "mkt-open" : "mkt-closed");
    $("meta").textContent = `Updated ${data.updatedIST || "—"}`;
    $("signals-asof").textContent = data.signalsAsOf ? ("· Signals " + data.signalsAsOf) : "";
    const btxt = (data.banner && data.banner.text) || "Size down";
    $("banner").innerHTML = `<span class="pill">SIZE DOWN</span> <span>${btxt}</span>`;
    $("backdrop-pill").textContent = (data.banner && data.banner.gex != null)
      ? `γ ${data.banner.gex}` : "Backdrop";
    $("btnote").textContent = data.backtestNote || "";
    $("btnote-toggle").hidden = !(data.backtestNote && data.backtestNote.length > 120);
    const spyPx = data.spy?.price;
    $("spy").innerHTML = `SPY <b class="tnum ${flashClass("SPY", spyPx)}">${fmt(spyPx)}</b> <span class="${clsChg(data.spy?.changePct)}">${fmtPct(data.spy?.changePct)}${arrow(data.spy?.changePct)}</span>`;

    const early = data.earlySureShots || [];
    const weekly = data.weeklyBullish || [];
    const squeeze = data.weeklySqueeze || [];
    const reversal = data.reversalBearish || [];
    const watch = data.watchlist || [];
    $("c-early").textContent = String(early.length);
    $("c-weekly").textContent = String(weekly.length);
    $("c-squeeze").textContent = String(squeeze.length);
    $("c-reversal").textContent = String(reversal.length);
    $("c-watch").textContent = String(watch.length);

    $("panel-early").innerHTML = early.length
      ? early.map(earlyCard).join("")
      : emptyState("No sure shots right now", "Midweek forming alerts stay prep-only until Friday / ABSORBED.");
    $("panel-weekly").innerHTML = weekly.length ? weekly.map(r => signalCard(r, "weekly")).join("") : emptyState("No Weekly ★ bullish cards", "");
    $("panel-squeeze").innerHTML = squeeze.length ? squeeze.map(r => signalCard(r, "weekly")).join("") : emptyState("No squeeze cards", "");
    $("panel-reversal").innerHTML = reversal.length ? reversal.map(r => signalCard(r, "reversal")).join("") : emptyState("No reversal bearish cards", "");
    $("panel-watch").innerHTML = watchTable(watch);

    const errs = data.errors || [];
    const staleAge = data.quotesStaleAgeSec;
    const quoteBad = errs.length > 0 || spyPx == null || (staleAge != null && staleAge > 60);
    $("quote-warn").classList.toggle("show", quoteBad);
    if (quoteBad) {
      if (spyPx != null && staleAge != null) {
        $("quote-warn").textContent = `Showing last-good quotes (~${Math.round(staleAge)}s old). Yahoo refresh limited.`;
      } else if (errs.length) {
        $("quote-warn").textContent = "Quotes delayed / limited — " + String(errs[0]).slice(0, 120);
      } else {
        $("quote-warn").textContent = "Quotes delayed — live prices temporarily unavailable.";
      }
    }
    $("errors").textContent = errs.length > 1 ? ("Also: " + errs.slice(1, 3).join(" · ")) : "";
    $("footer").textContent = (data.disclaimer || "Not financial advice.") + " Admin edits positions; guest read-only. No order placement.";
    updateKpis();
  } catch (e) {
    const aborted = e && (e.name === "AbortError" || /abort/i.test(String(e.message || "")));
    $("meta").textContent = aborted ? "Snapshot timed out — retrying…" : ("Fetch failed: " + e.message);
    $("live-dot").classList.add("stale");
    $("quote-warn").classList.add("show");
    $("quote-warn").textContent = aborted
      ? "Snapshot timed out (Yahoo slow). Will retry on next poll."
      : "Network error refreshing snapshot.";
  }
}

loadMe().then(() => { resetForm(); refreshPositions(); });
refresh();
setInterval(refresh, 5000);
setInterval(() => {
  if (document.querySelector('.tab[data-tab="positions"].active')) refreshPositions();
}, 15000);
</script>
</body>
</html>
