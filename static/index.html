<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Live Options Plan</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel2: #1a2230;
    --border: #243044;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --green: #3dd68c;
    --red: #ff6b7a;
    --amber: #f5c542;
    --blue: #5b9cff;
    --purple: #b388ff;
    --skip: #555e6e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 12px 14px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 12px; }
  .banner {
    background: linear-gradient(90deg, #3a1d1d, #2a1520 40%, #1a2230);
    border: 1px solid #5a2a2a;
    color: #ffb4b4;
    padding: 10px 14px; border-radius: 10px;
    margin-bottom: 14px; font-weight: 600;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .banner .pill { background: #5a2020; color: #ffd0d0; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
    min-height: 44px;
  }
  .tab.active { background: var(--panel2); color: var(--text); border-color: var(--blue); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card.skip { opacity: 0.55; }
  .card.rec { border-color: #2a5a3a; box-shadow: inset 0 0 0 1px #1e3a28; }
  .row-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
  .sym { font-size: 1.15rem; font-weight: 750; }
  .tag { color: var(--amber); font-size: 12px; font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 12px; margin-top: 10px;
  }
  .kv { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .kv .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kv .v { font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; word-break: break-word; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .status {
    display: inline-block; padding: 3px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  }
  .st-WAITING { background: #2a3140; color: #c0c8d8; }
  .st-TRIGGERED { background: #1e3d2a; color: var(--green); }
  .st-STOPPED { background: #3d1e24; color: var(--red); }
  .st-IN { background: #2a2540; color: var(--purple); }
  .st-SKIP { background: #2a2e36; color: var(--skip); }
  .st-REC { background: #1e3d2a; color: var(--green); }
  .st-SEC { background: #2a3140; color: #c0c8d8; }
  .st-above\ high { background: #1e3d2a; color: var(--green); }
  .st-between { background: #2a3140; color: #c0c8d8; }
  .st-below\ low { background: #3d1e24; color: var(--red); }
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.04em; margin-left: 4px;
  }
  .b-STOP_HIT, .b-ADVERSE_50 { background: #5a2020; color: #ffd0d0; }
  .b-TARGET_HIT { background: #1e3d2a; color: var(--green); }
  .b-EXIT_FRIDAY, .b-EXIT_EXPIRY { background: #3a3010; color: var(--amber); }
  .b-COVER_HIT { background: #2a2540; color: var(--purple); }
  .b-EARNINGS { background: #3a2a10; color: #ffcc80; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 16px; }
  .btnote {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; color: var(--muted); font-size: 12px;
  }
  .err { color: var(--amber); font-size: 12px; margin-top: 8px; }
  .footer { color: var(--muted); font-size: 11px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
  .occ { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
  .userbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; color: var(--muted); font-size: 12px;
  }
  .userbar b { color: var(--text); }
  .userbar button, .btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 14px; min-height: 44px; font-weight: 600; cursor: pointer;
    font-size: 14px;
  }
  .btn-primary { background: #1e3a5f; border-color: var(--blue); }
  .btn-danger { background: #3d1e24; border-color: #5a2a2a; color: #ffb4b4; }
  .btn-sm { min-height: 36px; padding: 6px 10px; font-size: 12px; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px 12px;
  }
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px 10px; font-size: 16px; min-height: 44px;
  }
  textarea { min-height: 72px; font-size: 14px; }
  .progress {
    height: 12px; background: #1a2230; border-radius: 999px; overflow: hidden; border: 1px solid var(--border);
    margin-top: 6px;
  }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); }
  .progress.warn > i { background: linear-gradient(90deg, var(--amber), var(--green)); }
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .admin-only { display: none; }
  body.is-admin .admin-only { display: block; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  @media (max-width: 700px) {
    .wrap { padding: 10px 10px 48px; }
    th:nth-child(n+5), td:nth-child(n+5) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Live Options Plan</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div class="userbar" id="userbar">Signed in as <b id="who">…</b>
        <button type="button" id="signout">Sign out</button>
      </div>
      <div class="meta" id="spy"></div>
    </div>
  </header>

  <div class="banner" id="banner">SPY negative gamma — size down</div>
  <div class="btnote" id="btnote"></div>

  <div class="tabs">
    <button class="tab active" data-tab="early">Early ★ Sure-shot</button>
    <button class="tab" data-tab="weekly">Weekly ★ Bullish</button>
    <button class="tab" data-tab="squeeze">Squeeze Setups</button>
    <button class="tab" data-tab="reversal">Reversal Bearish</button>
    <button class="tab" data-tab="watch">Reversals Watch</button>
    <button class="tab" data-tab="positions">My Positions</button>
  </div>

  <div class="hint" id="hint"></div>

  <section class="panel active" id="panel-early"></section>
  <section class="panel" id="panel-weekly"></section>
  <section class="panel" id="panel-squeeze"></section>
  <section class="panel" id="panel-reversal"></section>
  <section class="panel" id="panel-watch"></section>
  <section class="panel" id="panel-positions">
    <div class="summary-bar" id="pos-summary"></div>
    <div class="admin-only card" id="pos-form-wrap">
      <div class="row-top"><div><b>Add / edit position</b> <span class="note" id="form-hint">Rulebook defaults autofill stop/target</span></div></div>
      <form id="pos-form" class="form-grid" style="margin-top:10px" onsubmit="return false;">
        <input type="hidden" id="f-id" value="" />
        <div><label>Ticker</label><input id="f-ticker" autocomplete="off" placeholder="NVDA" /></div>
        <div><label>Signal type</label>
          <select id="f-signal">
            <option value="WEEKLY">WEEKLY (bullish)</option>
            <option value="SQ">SQ</option>
            <option value="SQ+VC3">SQ+VC3</option>
            <option value="REVERSAL">REVERSAL (bearish)</option>
            <option value="ABSORBED">ABSORBED</option>
          </select>
        </div>
        <div><label>Side</label>
          <select id="f-side"><option value="call">call</option><option value="put">put</option></select>
        </div>
        <div><label>Structure</label>
          <select id="f-structure"><option value="atm">ATM single</option><option value="spread">Debit spread</option><option value="1em">1EM spread</option></select>
        </div>
        <div><label>Long OCC</label><input id="f-long" class="occ" placeholder="NVDA261106C00190000" /></div>
        <div><label>Short OCC (optional)</label><input id="f-short" class="occ" placeholder="leave blank for single" /></div>
        <div><label>Qty (contracts)</label><input id="f-qty" type="number" inputmode="numeric" min="1" value="1" /></div>
        <div><label>Fill debit / contract</label><input id="f-fill" type="number" inputmode="decimal" step="0.01" placeholder="2.45" /></div>
        <div><label>Entry date</label><input id="f-entry" type="date" /></div>
        <div><label>Expiry</label><input id="f-expiry" type="date" /></div>
        <div><label>Stop (underlying)</label><input id="f-stop" type="number" inputmode="decimal" step="0.01" placeholder="signal-week low / D+1 high" /></div>
        <div><label>Profit target %</label><input id="f-pt" type="number" inputmode="decimal" step="1" value="100" /></div>
        <div><label>Time exit</label>
          <select id="f-time"><option value="friday">Friday close</option><option value="expiry">2d before expiry</option></select>
        </div>
        <div><label>Cover level (reversals)</label><input id="f-cover" type="number" inputmode="decimal" step="0.01" /></div>
        <div style="grid-column:1/-1"><label>Notes</label><textarea id="f-notes" placeholder="optional"></textarea></div>
      </form>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-save">Save position</button>
        <button type="button" class="btn" id="btn-reset">Clear form</button>
      </div>
      <div class="err" id="pos-form-err"></div>
    </div>
    <div id="pos-list"></div>
  </section>

  <div class="err" id="errors"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d=2) => (n == null || Number.isNaN(n)) ? "—" : Number(n).toFixed(d);
const fmtPct = (n) => (n == null) ? "—" : ((n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%");
const clsChg = (n) => (n == null) ? "" : (n >= 0 ? "pos" : "neg");
const money = (n) => (n == null) ? "—" : ((n >= 0 ? "+" : "") + "$" + Number(n).toFixed(2));

let ME = { user: null, role: "guest", canEdit: false };

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $("panel-" + btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "positions") refreshPositions();
  });
});

function kv(k, v, extra="") {
  return `<div class="kv"><div class="k">${k}</div><div class="v ${extra}">${v}</div></div>`;
}

function badges(kinds, earningsBadge) {
  let html = "";
  (kinds || []).forEach(k => {
    const label = k.replace(/_/g, " ");
    html += `<span class="badge b-${k}">${label}</span>`;
  });
  if (earningsBadge) html += `<span class="badge b-EARNINGS">${earningsBadge}</span>`;
  return html;
}

function atmBlock(side, atm) {
  if (!atm) return kv("ATM " + side, "—");
  return kv("ATM " + side + " " + fmt(atm.strike, 2),
    `mid ${fmt(atm.mid, 2)} · bid ${fmt(atm.bid, 2)} / ask ${fmt(atm.ask, 2)}`);
}

function occLine(r) {
  if (r.is_atm) return r.long_occ || "";
  return `${r.long_occ || ""} / ${r.short_occ || ""}`;
}

function earlyCard(r) {
  const plan = r.plan || {};
  const side = r.side === 'bearish' ? 'BEAR' : 'BULL';
  const st = r.earningsFlag ? 'EARNINGS' : (r.tier === 'S' ? 'REC' : 'WATCH');
  const stClass = r.earningsFlag ? 'st-STOPPED' : (r.tier === 'S' ? 'st-REC' : 'st-WAITING');
  const occ = plan.long_occ ? (plan.is_atm ? plan.long_occ : (plan.long_occ + ' / ' + (plan.short_occ||''))) : '—';
  return `<div class="card rec">
    <div class="row-top">
      <div>
        <span class="sym">${r.sym}</span>
        <span class="tag">${side} · ${r.setup || ''} · conf ${(r.confidence*100).toFixed(0)}%</span>
        <div class="note">${r.why || ''} · ${r.days_early || ''}${r.tierNote ? ' · ' + r.tierNote : ''}</div>
        ${badges(r.alertKinds, r.earningsBadge)}
      </div>
      <span class="status ${stClass}">${st}</span>
    </div>
    <div class="grid">
      ${kv("Price", `${fmt(r.price)} <span class="${clsChg(r.changePct)}">${fmtPct(r.changePct)}</span>`)}
      ${kv("Entry", r.entry || '—')}
      ${kv("Trigger", r.trigger != null ? fmt(r.trigger,2) : '—')}
      ${kv("Stop", r.stop != null ? (typeof r.stop==='number'?fmt(r.stop,2):r.stop) : '—')}
      ${kv("Structure", plan.structure || r.structure || '—')}
      ${kv("OCC", `<span class="occ">${occ}</span>`)}
      ${kv("Debit", plan.debit != null ? fmt(plan.debit,3) : '—')}
      ${kv("Live mid", plan.spreadMid != null ? fmt(plan.spreadMid,3) : '—')}
      ${kv("Size", plan.size != null ? String(plan.size) : (r.size || '—'))}
      ${kv("Source", r.source + ' · ' + (r.week || r.session || ''))}
    </div>
  </div>`;
}

function signalCard(r, mode) {
  const skip = r.skip;
  const rec = r.recommended && !skip;
  let status, stClass;
  if (mode === "reversal") {
    status = r.status || "WAITING";
    stClass = "st-" + status;
  } else {
    status = skip ? "SKIP" : (r.recommended ? "REC" : "SEC");
    stClass = skip ? "st-SKIP" : (rec ? "st-REC" : "st-SEC");
  }
  const struct = r.structure_label || (r.is_atm ? ("ATM " + r.side) : "debit spread");
  const maxP = r.maxProfit == null ? "uncapped" : fmt(r.maxProfit, 3);
  const strikes = r.is_atm
    ? fmt(r.long_strike, 2) + " ATM"
    : fmt(r.long_strike, 2) + " / " + fmt(r.short_strike, 2);

  let triggerKvs = "";
  if (mode === "reversal") {
    triggerKvs = r.already_in
      ? kv("Cover if >", fmt(r.cover_above, 2) + (r.distTrigger != null ? ` (Δ ${fmt(r.distTrigger, 2)})` : ""))
        + kv("Entry short", fmt(r.entry, 2))
      : kv("Trigger <", fmt(r.trigger, 2) + (r.distTrigger != null ? ` (dist ${fmt(r.distTrigger, 2)})` : ""))
        + kv("Stop >", fmt(r.sl, 2) + (r.distSL != null ? ` (room ${fmt(r.distSL, 2)})` : ""));
  }

  return `<div class="card ${skip ? "skip" : ""} ${rec ? "rec" : ""}">
    <div class="row-top">
      <div>
        <span class="sym">${r.symbol}</span>
        <span class="tag">${r.tag || r.setup || ""}</span>
        <div class="note">${r.note || ""} · ${struct} · <span class="occ">${occLine(r)}</span></div>
        ${badges(r.alertKinds, r.earningsBadge)}
      </div>
      <span class="status ${stClass}">${status}</span>
    </div>
    <div class="grid">
      ${kv("Price", `${fmt(r.price)} <span class="${clsChg(r.changePct)}">${fmtPct(r.changePct)}</span>`)}
      ${triggerKvs}
      ${kv("Expiry", r.expiry)}
      ${kv("Structure", struct)}
      ${kv("Strikes", strikes)}
      ${kv(r.is_atm ? "Option mid" : "Spread mid", fmt(r.spreadMid, 3))}
      ${kv("Fri debit", fmt(r.debit, 3))}
      ${kv("P&L / unit", money(r.pnlPerSpread != null ? r.pnlPerSpread * 100 : null), clsChg(r.pnlPerSpread))}
      ${kv("P&L ×" + r.size, money(r.pnlTotal), clsChg(r.pnlTotal))}
      ${kv("Max profit", maxP)}
      ${kv("Breakeven", fmt(r.breakeven, 2))}
      ${kv("Long IV", r.long?.iv != null ? (r.long.iv * 100).toFixed(1) + "%" : "—")}
      ${kv("Δ long", fmt(r.delta, 3))}
      ${atmBlock(r.side === "put" ? "put" : "call", r.atm)}
      ${kv("Size", String(r.size) + (r.is_atm ? " ct" : " spr") + " · risk ~$" + fmt((r.debit || 0) * 100 * (r.size || 0), 0))}
    </div>
  </div>`;
}

function watchTable(rows) {
  const body = rows.map(w => `<tr>
    <td><b>${w.symbol}</b></td>
    <td>${fmt(w.price)}</td>
    <td class="${clsChg(w.changePct)}">${fmtPct(w.changePct)}</td>
    <td>${fmt(w.low)}</td>
    <td>${fmt(w.high)}</td>
    <td><span class="status st-${w.status}">${w.status}</span></td>
  </tr>`).join("");
  return `<div class="card"><div class="note" style="margin-bottom:8px">Arm only if Monday breaks low before high</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Sym</th><th>Price</th><th>Chg</th><th>Low</th><th>High</th><th>Status</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div></div>`;
}

function applyDefaults() {
  const st = $("f-signal").value;
  const side = $("f-side").value;
  const structure = $("f-structure").value;
  fetch(`/api/positions/defaults?signal_type=${encodeURIComponent(st)}&side=${side}&structure=${structure}`, { credentials: "same-origin" })
    .then(r => r.json()).then(d => {
      if (!d.ok) return;
      const def = d.defaults || {};
      if (!$("f-id").value) {
        $("f-pt").value = def.profit_target_pct ?? 100;
        $("f-time").value = def.time_exit || "friday";
        $("form-hint").textContent = def.stop_hint || "Rulebook defaults";
        if (def.side) $("f-side").value = def.side;
      }
    }).catch(() => {});
}

["f-signal","f-side","f-structure"].forEach(id => $(id).addEventListener("change", applyDefaults));

function resetForm() {
  $("f-id").value = "";
  $("f-ticker").value = "";
  $("f-signal").value = "WEEKLY";
  $("f-side").value = "call";
  $("f-structure").value = "atm";
  $("f-long").value = "";
  $("f-short").value = "";
  $("f-qty").value = "1";
  $("f-fill").value = "";
  $("f-entry").value = new Date().toISOString().slice(0,10);
  $("f-expiry").value = "";
  $("f-stop").value = "";
  $("f-pt").value = "100";
  $("f-time").value = "friday";
  $("f-cover").value = "";
  $("f-notes").value = "";
  $("pos-form-err").textContent = "";
  applyDefaults();
}

function fillForm(p) {
  $("f-id").value = p.id;
  $("f-ticker").value = p.ticker || "";
  $("f-signal").value = p.signal_type || "WEEKLY";
  $("f-side").value = p.side || "call";
  $("f-structure").value = p.structure || "atm";
  $("f-long").value = p.long_occ || "";
  $("f-short").value = p.short_occ || "";
  $("f-qty").value = p.quantity || 1;
  $("f-fill").value = p.fill_debit ?? "";
  $("f-entry").value = (p.entry_date || "").slice(0,10);
  $("f-expiry").value = (p.expiry || "").slice(0,10);
  $("f-stop").value = p.stop_underlying ?? "";
  $("f-pt").value = p.profit_target_pct ?? 100;
  $("f-time").value = p.time_exit || "friday";
  $("f-cover").value = p.cover_level ?? "";
  $("f-notes").value = p.notes || "";
  window.scrollTo({ top: $("pos-form-wrap").offsetTop - 20, behavior: "smooth" });
}

function formPayload() {
  return {
    ticker: $("f-ticker").value.trim(),
    signal_type: $("f-signal").value,
    side: $("f-side").value,
    structure: $("f-structure").value,
    long_occ: $("f-long").value.trim(),
    short_occ: $("f-short").value.trim() || null,
    quantity: Number($("f-qty").value || 1),
    fill_debit: Number($("f-fill").value),
    entry_date: $("f-entry").value,
    expiry: $("f-expiry").value || null,
    stop_underlying: $("f-stop").value === "" ? null : Number($("f-stop").value),
    profit_target_pct: Number($("f-pt").value || 100),
    time_exit: $("f-time").value,
    cover_level: $("f-cover").value === "" ? null : Number($("f-cover").value),
    notes: $("f-notes").value || null,
  };
}

$("btn-reset").addEventListener("click", resetForm);
$("btn-save").addEventListener("click", async () => {
  if (!ME.canEdit) { $("pos-form-err").textContent = "Guest is read-only"; return; }
  const payload = formPayload();
  const id = $("f-id").value;
  $("pos-form-err").textContent = "Saving…";
  try {
    const res = await fetch(id ? `/api/positions/${id}` : "/api/positions", {
      method: id ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) { $("pos-form-err").textContent = data.error || res.status; return; }
    $("pos-form-err").textContent = "Saved.";
    resetForm();
    refreshPositions();
  } catch (e) {
    $("pos-form-err").textContent = e.message;
  }
});

function renderSummary(s) {
  if (!s) { $("pos-summary").innerHTML = ""; return; }
  const pct = s.targetProgressPct || 0;
  $("pos-summary").innerHTML = `
    ${kv("Open", String(s.openCount || 0))}
    ${kv("Risk deployed", "$" + fmt(s.riskDeployed,0) + " / $100k (" + fmt(s.riskPct,1) + "%)")}
    ${kv("Unrealized P&L", money(s.unrealizedPnl), clsChg(s.unrealizedPnl))}
    ${kv("WTD P&L", money(s.weekPnl) + " vs $3–4k", clsChg(s.weekPnl))}
    <div class="kv" style="grid-column:1/-1">
      <div class="k">Weekly target progress (mid $3.5k)</div>
      <div class="v">${fmt(pct,0)}%</div>
      <div class="progress ${pct < 50 ? "warn" : ""}"><i style="width:${Math.min(100,pct)}%"></i></div>
    </div>`;
}

const POS_MAP = {};
function positionCard(p) {
  POS_MAP[p.id] = p;
  const editBtns = ME.canEdit ? `
    <div class="actions">
      <button type="button" class="btn btn-sm" onclick="editPos(${p.id})">Edit</button>
      <button type="button" class="btn btn-sm btn-danger" onclick="closePos(${p.id})">Close</button>
      <button type="button" class="btn btn-sm" onclick="delPos(${p.id})">Delete</button>
    </div>` : `<div class="note">Read-only (guest)</div>`;
  return `<div class="card">
    <div class="row-top">
      <div>
        <span class="sym">${p.ticker}</span>
        <span class="tag">${p.signal_type} · ${p.side} · ${p.structure}</span>
        <div class="note"><span class="occ">${p.long_occ}${p.short_occ ? " / " + p.short_occ : ""}</span>
          · qty ${p.quantity} · entry ${p.entry_date} · expiry ${p.expiry || "—"}</div>
        ${badges(p.alertKinds, p.earningsBadge)}
      </div>
      <span class="status ${p.status === "open" ? "st-IN" : "st-SKIP"}">${(p.status || "").toUpperCase()}</span>
    </div>
    <div class="grid">
      ${kv("Underlying", fmt(p.underlying))}
      ${kv("Fill debit", fmt(p.fill_debit, 3))}
      ${kv("Live mark", fmt(p.mark, 3))}
      ${kv("P&L $", money(p.pnlTotal), clsChg(p.pnlTotal))}
      ${kv("P&L %", fmtPct(p.pnlPct), clsChg(p.pnlPct))}
      ${kv("Cost", "$" + fmt(p.cost, 0))}
      ${kv("Stop", p.stop_underlying != null ? fmt(p.stop_underlying) : "—")}
      ${kv("Target mark", fmt(p.targetMark, 3) + " (+" + fmt(p.profit_target_pct,0) + "%)")}
      ${kv("Time exit", p.time_exit || "friday")}
      ${kv("Cover", p.cover_level != null ? fmt(p.cover_level) : "—")}
    </div>
    ${editBtns}
  </div>`;
}

function editPos(id){ if(POS_MAP[id]) fillForm(POS_MAP[id]); }
async function closePos(id) {
  if (!ME.canEdit) return;
  const pnl = prompt("Close P&L $ (optional, leave blank)");
  const body = { close_reason: "manual" };
  if (pnl !== null && pnl !== "") body.close_pnl = Number(pnl);
  const res = await fetch(`/api/positions/${id}/close`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    credentials: "same-origin", body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) alert(data.error || res.status);
  refreshPositions();
}

async function delPos(id) {
  if (!ME.canEdit) return;
  if (!confirm("Delete position #" + id + "?")) return;
  const res = await fetch(`/api/positions/${id}`, { method: "DELETE", credentials: "same-origin" });
  const data = await res.json();
  if (!data.ok) alert(data.error || res.status);
  refreshPositions();
}

async function refreshPositions() {
  try {
    const res = await fetch("/api/positions?status=open", { cache: "no-store", credentials: "same-origin" });
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (!data.ok) {
      $("pos-list").innerHTML = `<div class="card"><div class="err">${data.error || "positions unavailable"}</div></div>`;
      return;
    }
    ME.canEdit = !!data.canEdit;
    if (ME.canEdit) document.body.classList.add("is-admin");
    else document.body.classList.remove("is-admin");
    renderSummary(data.summary);
    const rows = data.positions || [];
    $("pos-list").innerHTML = rows.length
      ? rows.map(positionCard).join("")
      : `<div class="card"><div class="note">No open positions.${ME.canEdit ? " Use the form above to add one." : ""}</div></div>`;
  } catch (e) {
    $("pos-list").innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
}

async function loadMe() {
  try {
    const res = await fetch("/api/me", { cache: "no-store", credentials: "same-origin" });
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (data.ok) {
      ME = { user: data.user, role: data.role, canEdit: data.role === "admin" };
      $("who").textContent = data.user + (data.role === "admin" ? " (admin)" : " (guest)");
      if (ME.canEdit) document.body.classList.add("is-admin");
      else document.body.classList.remove("is-admin");
    }
  } catch (e) { /* ignore */ }
}

document.getElementById("signout").addEventListener("click", async () => {
  try {
    await fetch("/logout", { method: "POST", headers: { "Accept": "application/json" }, credentials: "same-origin" });
  } catch (e) { /* ignore */ }
  location.href = "/login";
});

async function refresh() {
  try {
    const res = await fetch("/api/snapshot", { cache: "no-store", credentials: "same-origin" });
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (!data.ok) {
      $("meta").textContent = "Error: " + (data.error || res.status);
      return;
    }
    $("meta").textContent = `Signals as of ${data.signalsAsOf} · Updated ${data.updatedIST} / ${data.updatedET} · auto-refresh 5s`;
    $("banner").innerHTML = `<span class="pill">SIZE DOWN</span> ${data.banner.text}`;
    $("btnote").textContent = data.backtestNote || "";
    $("spy").innerHTML = `SPY <b>${fmt(data.spy?.price)}</b> <span class="${clsChg(data.spy?.changePct)}">${fmtPct(data.spy?.changePct)}</span>`;
    $("hint").textContent = data.disclaimer;
    const early = data.earlySureShots || [];
    $("panel-early").innerHTML = (early.length ? early.map(earlyCard).join("") : "<div class='card'><div class='note'>No Tier-S sure shots right now. Midweek forming alerts are not shown here (prep-only until Friday / ABSORBED).</div></div>");
    $("panel-weekly").innerHTML = (data.weeklyBullish || []).map(r => signalCard(r, "weekly")).join("") || "<div class='note'>No bullish ★ cards</div>";
    $("panel-squeeze").innerHTML = (data.weeklySqueeze || []).map(r => signalCard(r, "weekly")).join("") || "<div class='note'>No squeeze cards</div>";
    $("panel-reversal").innerHTML = (data.reversalBearish || []).map(r => signalCard(r, "reversal")).join("");
    $("panel-watch").innerHTML = watchTable(data.watchlist || []);
    $("errors").textContent = (data.errors && data.errors.length) ? ("Yahoo partial errors: " + data.errors.join(" · ")) : "";
    $("footer").textContent = data.disclaimer + " Positions: admin can edit; guest read-only. No order placement.";
  } catch (e) {
    $("meta").textContent = "Fetch failed: " + e.message;
  }
}
loadMe().then(() => { resetForm(); refreshPositions(); });
refresh();
setInterval(refresh, 5000);
setInterval(() => {
  if (document.querySelector('.tab[data-tab="positions"].active')) refreshPositions();
}, 15000);
</script>
</body>
</html>
