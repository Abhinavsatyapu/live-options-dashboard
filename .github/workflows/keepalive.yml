name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping dashboard health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 https://live-options-dashboard.onrender.com/api/health) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
